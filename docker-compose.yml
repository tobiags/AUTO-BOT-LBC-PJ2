version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autotransfert
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autotransfert_p2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotransfert"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autotransfert
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autotransfert_p2_test
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  experimental_lab:
    build:
      context: .
      dockerfile: lab/Dockerfile
    profiles: ["lab"]
    environment:
      LAB_API_TOKEN: ${LAB_API_TOKEN:-change-me}
      LAB_ALLOWED_DOMAINS: ${LAB_ALLOWED_DOMAINS:-leboncoin.fr,www.leboncoin.fr}
    ports:
      - "8010:8010"
    volumes:
      - lab_reports:/runtime/reports

volumes:
  postgres_data:
  lab_reports:
